[package]
name = "nimbora-softphone"
version = "1.2.1"
description = "NIMBORA Softphone — the enterprise PBX on every device"
authors = ["NIMBORA"]
license = "BSD-2-Clause"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Desktop binary + mobile libraries share one entry point.
name = "nimbora_softphone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
