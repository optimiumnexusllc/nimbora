global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Per-worker runtime metrics (calls, latencies, TTS cache): every worker.
  - job_name: nimbora
    metrics_path: /api/v1/metrics
    http_headers:
      X-NIMBORA-Devops-Secret:
        files:
          - /run/secrets/nimbora_devops_secret
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 10s

  # Fleet-wide business metrics (PBX of each company, subscriptions, minutes):
  # they read the database, so ONE target, once a minute.
  - job_name: nimbora-business
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /api/v1/metrics/business
    http_headers:
      X-NIMBORA-Devops-Secret:
        files:
          - /run/secrets/nimbora_devops_secret
    file_sd_configs:
      - files:
          - /etc/prometheus/business-targets.json

  # Hosts: the platform server and each PBX (install.sh --metrics-from),
  # node exporter with the backups' freshness (textfile collector).
  - job_name: node
    scrape_interval: 30s
    file_sd_configs:
      - files:
          - /etc/prometheus/node-targets.json
        refresh_interval: 60s
