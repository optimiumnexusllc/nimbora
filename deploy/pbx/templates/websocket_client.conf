; [[ brand_name ]] AI agents: audio of AI calls (external media).
; Managed by the [[ brand_name ]] PBX kit (deploy/pbx/whitelabel.yml).
[nimbora]
type = websocket_client
uri = [[ nimbora_ws_url ]]
protocols = media
[% if nimbora_ws_url.startswith('wss://') %]
tls_enabled = yes
ca_list_file = /etc/ssl/certs/ca-certificates.crt
[% endif %]
