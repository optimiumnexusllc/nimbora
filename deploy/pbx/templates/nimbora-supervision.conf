; NIMBORA supervision: listen to, whisper to or barge into an extension's call.
;
; Reached only by calls NIMBORA starts through the engine's call API
; (POST /calls, source = the supervisor's phone). The context is included in
; no user context, so no phone can dial it. NIMBORA sets the variables; they
; are still checked here before ChanSpy runs.
;
;   NIMBORA_SPY_TARGET   PJSIP/<line>-   (trailing dash: one line only)
;   NIMBORA_SPY_OPTIONS  qE | qwE | qBE  (listen | whisper | barge)

[nimbora-supervision]
exten => spy,1,NoOp(NIMBORA supervision: ${NIMBORA_SPY_LABEL})
 same => n,GotoIf($[${REGEX("^PJSIP/[A-Za-z0-9_.@+-]+-$" ${NIMBORA_SPY_TARGET})}]?options)
 same => n,Hangup()
 same => n(options),GotoIf($[${REGEX("^q[wB]?E$" ${NIMBORA_SPY_OPTIONS})}]?spy)
 same => n,Hangup()
 same => n(spy),Answer()
 same => n,ChanSpy(${NIMBORA_SPY_TARGET},${NIMBORA_SPY_OPTIONS})
 same => n,Hangup()
