# Fail2Ban jail for the PBX engine's authentication API, next to the engine's
# own jails (asterisk-wazo, wazo-provd, sshd). Installed by deploy/pbx/install.sh
# as /etc/fail2ban/jail.d/nimbora-pbx.conf; __NIMBORA_IPS__ is replaced by the
# platform's addresses (private --nimbora-ip and the public address of
# --nimbora-url), which must never be banned: the platform authenticates on
# this API, and the engine's own connections to it carry that source address.
# Behind a reverse proxy, wazo-auth sees the proxy's address unless
# --trusted-proxy makes nginx log the real client.
[nimbora-pbx-auth]
enabled  = true
filter   = nimbora-pbx-auth
logpath  = /var/log/wazo-auth.log
action   = iptables-multiport[name=NIMBORA-AUTH, port="443,5060,5061", protocol=tcp]
ignoreip = 127.0.0.1/8 ::1 __NIMBORA_IPS__
findtime = 600
maxretry = 5
bantime  = 3600
