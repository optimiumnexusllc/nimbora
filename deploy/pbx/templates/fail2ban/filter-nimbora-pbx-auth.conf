# Fail2Ban filter for the PBX engine's authentication API (wazo-auth).
# Installed by deploy/pbx/install.sh as /etc/fail2ban/filter.d/nimbora-pbx-auth.conf.
#
# wazo-auth logs every refused token request with the client address:
#   2026-11-21 20:34:13,781 UTC [pid 45056] [tid 1263…] (INFO) (wazo_auth.plugins.http.tokens.http): Failed login: unknown username or password for login baduser from 203.0.113.9 using agent "curl/8.5.0"
# fail2ban strips the date (datepattern) before applying failregex, so the
# expression anchors on the message, not on the line start.
[Definition]
failregex = \(wazo_auth\.plugins\.http\.tokens\.http\): Failed login: .* for login \S+ from <HOST> using agent
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S,%%f
