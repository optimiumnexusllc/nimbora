; Operator customizations (kept across upgrades).

[nimbora-inbound-custom]
; One line per inbound number: hand the call to the AI agent of the tenant
; owning the number. The Stasis application name is shown in the tenant's
; telephony configuration in the web app.
; exten => 33123456789,1,Stasis(nimbora-app-xxxxxxxx)

[nimbora-outbound-custom]
; Example for a trunk named "carrier" defined in pjsip_trunks.conf:
; exten => _+X.,1,Dial(PJSIP/${EXTEN}@carrier,60)
; exten => _X.,1,Dial(PJSIP/${EXTEN}@carrier,60)
