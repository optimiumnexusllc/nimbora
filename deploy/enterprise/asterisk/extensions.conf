; NIMBORA Enterprise dialplan.
[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

; Calls arriving from carriers (set context=from-trunk on your trunk endpoints).
; Route each DID to the Stasis application of the tenant that owns it in
; extensions_custom.conf (see README, "Numéros entrants"). Extensions defined in
; a context win over included ones, so routing lives in included contexts only.
[from-trunk]
include => nimbora-inbound-custom
include => nimbora-inbound-fallback

[nimbora-inbound-fallback]
exten => _X.,1,NoOp(Unassigned DID ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup()
exten => _+X.,1,Goto(_X.,1)

; Outbound PSTN through your trunk; used by queue overflow to a phone number.
[nimbora-outbound]
include => nimbora-outbound-custom
include => nimbora-outbound-fallback

[nimbora-outbound-fallback]
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)

#include extensions_custom.conf
; Generated: AI -> human queue entry points and per-tenant agent contexts.
#tryinclude nimbora/extensions_nimbora.conf
