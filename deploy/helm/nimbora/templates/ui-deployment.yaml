{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nimbora.ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nimbora.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- /* Omit spec.replicas only when the HPA object will actually render — matches
         the gate in templates/ui-hpa.yaml. If HPA is enabled but both metric
         targets are null the HPA is suppressed, so we must keep the static
         replica count here to avoid a Deployment with no owner. */ -}}
  {{- if not (and .Values.autoscaling.ui.enabled (or .Values.autoscaling.ui.targetCPUUtilizationPercentage .Values.autoscaling.ui.targetMemoryUtilizationPercentage)) }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nimbora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "nimbora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nimbora.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "nimbora.ui.image" . }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          env:
            # Next.js standalone binds to $HOSTNAME (falls back to 0.0.0.0).
            # Kubernetes injects HOSTNAME=<pod-name>, which /etc/hosts maps to the
            # pod IP — so without this, Next listens on the pod IP ONLY. In-cluster
            # Service traffic still works, but loopback (kubectl port-forward, local
            # health checks) is refused. Pin to 0.0.0.0 to listen on all interfaces.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "oss"
            - name: BACKEND_URL
              value: {{ default (printf "http://%s:%d" (include "nimbora.web.fullname" .) (int .Values.web.service.port)) .Values.ui.backendUrl | quote }}
            - name: ENABLE_TELEMETRY
              value: {{ .Values.config.enableTelemetry | quote }}
            - name: POSTHOG_KEY
              value: {{ .Values.config.posthogApiKey | quote }}
            - name: POSTHOG_HOST
              value: {{ .Values.config.posthogHost | quote }}
            {{- /* Charter, read at run time (ui/src/lib/brand.ts). */}}
            {{- range $key, $var := dict "name" "BRAND_NAME" "pbxName" "BRAND_PBX_NAME" "logoUrl" "BRAND_LOGO_URL" "logoDarkUrl" "BRAND_LOGO_DARK_URL" "markUrl" "BRAND_MARK_URL" "faviconUrl" "BRAND_FAVICON_URL" "primaryColor" "BRAND_PRIMARY_COLOR" "gradient" "BRAND_GRADIENT" "fontFamily" "BRAND_FONT_FAMILY" "fontUrl" "BRAND_FONT_URL" }}
            - name: {{ $var }}
              value: {{ index $.Values.brand $key | quote }}
            {{- end }}
            - name: BRAND_ASSETS_DIR
              value: /brand
          {{- if .Values.brand.assetsConfigMap }}
          volumeMounts:
            - name: brand
              mountPath: /brand
              readOnly: true
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.ui.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.ui.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- if .Values.brand.assetsConfigMap }}
      volumes:
        - name: brand
          configMap:
            name: {{ .Values.brand.assetsConfigMap }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
